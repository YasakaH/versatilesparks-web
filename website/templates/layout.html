<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical_url }}">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="{{ og_type|default('website') }}">
  <meta property="og:url" content="{{ canonical_url }}">
  {% if og_image %}
  <meta property="og:image" content="{{ og_image }}">
  {% endif %}
  <meta property="og:site_name" content="Versatile Sparks">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  {% if og_image %}
  <meta name="twitter:image" content="{{ og_image }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #818cf8;
      --code-bg: #1e293b;
      --max-width: 1000px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      background-color: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--primary);
    }

    main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 2rem;
      text-align: center;
      background-color: #070a12;
    }

    .footer-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .footer-links a:hover {
      color: var(--text);
    }

    .copyright {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0b0f19;
      border: none;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* JSON-LD Structured Data Injection */
    {{ json_ld_schemas | default('') }}

  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="/" class="logo-link" id="nav-logo">
        <span class="logo-dot"></span>
        <span>Versatile Sparks</span>
      </a>
      <nav>
        <a href="/" id="nav-home">Home</a>
        <a href="/about.html" id="nav-about">About</a>
        <a href="/errata.html" id="nav-errata">Errata</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="/about.html" id="footer-about">About</a>
        <a href="/errata.html" id="footer-errata">Errata</a>
        <a href="/privacy.html" id="footer-privacy">Privacy Policy</a>
        <a href="/terms.html" id="footer-terms">Terms & Conditions</a>
      </div>
      <p class="copyright">&copy; 2026 Yasaka Hanini. All rights reserved.</p>
    </div>
  </footer>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"token":"79b59b0abbbc495db5e51ce548253379"}' crossorigin="anonymous"></script>
</body>
</html>
