<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical_url }}">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="{{ og_type|default('website') }}">
  <meta property="og:url" content="{{ canonical_url }}">
  {% if og_image %}
  <meta property="og:image" content="{{ og_image }}">
  {% endif %}
  <meta property="og:site_name" content="Versatile Sparks">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  {% if og_image %}
  <meta name="twitter:image" content="{{ og_image }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <style>
    :root {
      --bg: #030712;
      --surface: rgba(17, 24, 39, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #6366f1;
      --code-bg: #111827;
      --max-width: 1200px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    .ambient-glows {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }
    .glow-blob {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.12;
    }
    .glow-1 {
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      top: -200px;
      left: -200px;
    }
    .glow-2 {
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      bottom: -200px;
      right: -200px;
    }

    header {
      border-bottom: 1px solid var(--border);
      background-color: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-link {
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 15px var(--primary);
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.25s ease;
      position: relative;
    }

    nav a:hover {
      color: var(--text);
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; width: 0; height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.25s ease;
    }
    nav a:hover::after {
      width: 100%;
    }

    main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 4rem 2rem;
      background-color: #02040a;
      position: relative;
    }

    .footer-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--text);
    }

    .copyright {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      letter-spacing: -0.01em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
      background-color: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* JSON-LD Structured Data Injection */
    {{ json_ld_schemas | default('') }}

  </style>
</head>
<body>
  <div class="ambient-glows">
    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>
  </div>

  <header>
    <div class="header-container">
      <a href="/" class="logo-link" id="nav-logo">
        <span class="logo-dot"></span>
        <span>Versatile Sparks</span>
      </a>
      <nav>
        <a href="/" id="nav-home">Home</a>
        <a href="/about.html" id="nav-about">About</a>
        <a href="/errata.html" id="nav-errata">Errata</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="/about.html" id="footer-about">About</a>
        <a href="/errata.html" id="footer-errata">Errata</a>
        <a href="/privacy.html" id="footer-privacy">Privacy Policy</a>
        <a href="/terms.html" id="footer-terms">Terms & Conditions</a>
      </div>
      <p class="copyright">&copy; 2026 Yasaka Hanini. All rights reserved.</p>
    </div>
  </footer>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"token":"79b59b0abbbc495db5e51ce548253379"}' crossorigin="anonymous"></script>
</body>
</html>
