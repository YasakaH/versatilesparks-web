<style>
  .breadcrumb {
    display: flex;
    gap: 0.5rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }
  .breadcrumb a {
    color: var(--text-muted);
    text-decoration: none;
  }
  .breadcrumb a:hover { color: var(--primary); }

  .title-header {
    margin-bottom: 3rem;
  }
  .title-header h2 {
    font-size: 2.25rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    letter-spacing: -0.02em;
  }
  .title-header p {
    color: var(--text-muted);
    font-size: 1.1rem;
  }

  .changelog-list {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .changelog-card {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
  }
  .changelog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 576px) {
    .changelog-header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  }
  .changelog-version {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
  }
  .changelog-date {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .changelog-changes {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .changelog-changes li {
    font-size: 1rem;
    line-height: 1.6;
    display: flex;
    gap: 0.5rem;
  }
  .changelog-changes li::before {
    content: "•";
    color: var(--primary);
    font-weight: bold;
  }
</style>

<div class="breadcrumb">
  <a href="/">Home</a>
  <span>/</span>
  <a href="/">Books</a>
  <span>/</span>
  <a href="/books/{{ book.id }}/">{{ book.title }}</a>
  <span>/</span>
  <span>Changelog</span>
</div>

<section class="title-header">
  <h2>Version History &amp; Changelog</h2>
  <p>{{ book.title }} — {{ book.subtitle }}</p>
</section>

<section class="changelog-list">
  {% for release in book.changelog %}
  <div class="changelog-card">
    <div class="changelog-header">
      <div class="changelog-version">v{{ release.version }}</div>
      <div class="changelog-date">Released on {{ release.date }}</div>
    </div>
    <ul class="changelog-changes">
      {% for change in release.changes %}
      <li>{{ change }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</section>
