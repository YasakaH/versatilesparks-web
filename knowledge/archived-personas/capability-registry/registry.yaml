capabilities:

  - id: security_review
    name: Security Review
    description: Identify security vulnerabilities, threats, and risks in systems and code.
    category: security
    version: 1.0.0
    status: active
    providers:
      - skill: security-review
      - skill: security-audit
    inputs:
      - name: target
        type: string
      - name: threat_model
        type: string
        optional: true
      - name: compliance_standard
        type: string
        optional: true
    outputs:
      - name: vulnerabilities
        type: string[]
      - name: risk_scores
        type: object
      - name: mitigations
        type: string[]
    dependencies:
      - repository_analysis
    cost: medium
    latency: medium
    confidence: high
    parallelizable: false
    quality_score: 90
    maintainer: cog-os

