project:
  type: book
  output-dir: ../dist-v2

book:
  title: "Browser Automation Playbook"
  subtitle: "Production Engineering Edition"
  author: "Yasaka Hanini"
  date: today
  language: en
  isbn: ""
  url: ""
  doi: ""
  license: "All rights reserved — see LICENSE.md"
  description: "A production-grade browser automation engineering handbook. Build reliable, observable, and recoverable automation systems with Python and nodriver."
  keyword: "browser automation, python, nodriver, web scraping, automation engineering, production automation"

  chapters:
    - index.md
    - 00-copyright.md
    - automation-mindset.md
    - part: "Foundations"
      chapters:
        - chapter-01.md
        - chapter-02.md
        - chapter-03.md
        - chapter-04.md
        - chapter-05.md
    - part: "Data & Operations"
      chapters:
        - chapter-06.md
        - chapter-07.md
        - chapter-08.md
        - chapter-09.md
        - chapter-10.md
    - part: "Advanced Production"
      chapters:
        - chapter-11.md
        - chapter-12.md
        - chapter-13.md
        - chapter-14.md
    - production-operations.md
    - appendix-versions.md
    - part: "Bonus Content"
      chapters:
        - bonus/automation-pattern-catalog.md
        - bonus/failure-playbook.md
        - bonus/war-stories.md
        - bonus/architecture-field-guide.md
        - bonus/automation-design-review.md
        - bonus/Production Reference Library.md
        - dist-extra/README.md
    - part: "Appendix"
      chapters:
        - dist-extra/docs/Errata.md

  page-navigation: true
  cover-image: Images/cover-front.png

format:
  pdf:
    documentclass: report
    classoption:
      - twoside
      - openany
    papersize: 6in,9in
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=0.75in
      - outer=0.60in
      - top=0.65in
      - bottom=0.65in
      - headheight=14pt
      - headsep=14pt
      - footskip=22pt
    fontsize: 10.5pt
    keep-tex: true
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: false
    links-as-notes: false
    pdf-engine: lualatex
    include-before-body:
      text: |
        \thispagestyle{empty}
        \begin{center}
        \vspace*{3.5cm}
        {\Huge\bfseries Browser Automation Playbook}\\[0.8cm]
        {\Large\itshape Production Engineering Edition}\\[2.0cm]
        {\large\bfseries Yasaka Hanini}\\[1cm]
        {\small \today}
        \vfill
        \end{center}
        \newpage
    include-in-header:
      text: |
        \setlength{\parindent}{0pt}
        \setlength{\emergencystretch}{6em}
        \sloppy
        \setcounter{secnumdepth}{1}

        \usepackage{eso-pic}
        \usepackage{fvextra}
        \usepackage{fontspec}
        \usepackage[most]{tcolorbox}
        \usepackage{float}
        \usepackage{adjustbox}
        \usepackage{booktabs}
        \usepackage{array}
        \floatplacement{figure}{htbp}
        \setkeys{Gin}{width=\linewidth,keepaspectratio}
        \AtBeginEnvironment{tabular}{\small\setlength{\tabcolsep}{3.5pt}}
        \AtBeginEnvironment{longtable}{\small\setlength{\tabcolsep}{3.5pt}}

        \makeatletter
        \newcommand{\centerfloat}{\centering}
        \makeatother

        \setmainfont{TeX Gyre Pagella}[
          Ligatures={Common,TeX},
        ]
        \setsansfont{TeX Gyre Heros}[
          Scale=MatchLowercase,
        ]
        \setmonofont{TeX Gyre Cursor}[
          Scale=0.88,
        ]

        \usepackage{fancyhdr}
        \fancypagestyle{plain}{\fancyhf{}\renewcommand{\headrulewidth}{0pt}}
        \pagestyle{fancy}
        \fancyhf{}
        \fancyhead{} % Clean top header (no alternating chapter text), matching reference PDF
        \fancyfoot[C]{\thepage}
        \renewcommand{\headrulewidth}{0pt}

        \definecolor{codecolor}{HTML}{003b4f}
        \definecolor{shadecolor}{RGB}{241,243,245}
        \definecolor{bordercolor}{HTML}{003b4f}

        \newcommand{\codefs}{\fontsize{7.9}{10.5}\selectfont}

        \AtBeginDocument{
          \renewenvironment{Shaded}{%
            \begin{tcolorbox}[
              enhanced,
              breakable,
              colback={shadecolor},
              colframe={bordercolor},
              leftrule=1.5pt,
              rightrule=0pt,
              toprule=0pt,
              bottomrule=0pt,
              arc=0pt,
              outer arc=0pt,
              left=10pt,
              right=6pt,
              top=6pt,
              bottom=6pt,
              boxsep=0pt
            ]%
          }{%
            \end{tcolorbox}%
          }

          \fvset{
            commandchars=\\\{\},
            breaklines=true,
            breakanywhere=true,
            breakautoindent=true,
            fontsize=\codefs,
            formatcom=\color{codecolor}\ttfamily,
          }

          \RecustomVerbatimEnvironment{verbatim}{Verbatim}{
            commandchars=\\\{\},
            breaklines=true,
            breakanywhere=true,
            breakautoindent=true,
            fontsize=\codefs,
            formatcom=\color{codecolor}\ttfamily,
          }

          \RecustomVerbatimEnvironment{Highlighting}{Verbatim}{
            commandchars=\\\{\},
            breaklines=true,
            breakanywhere=true,
            breakautoindent=true,
            fontsize=\codefs,
            formatcom=\color{codecolor}\ttfamily,
          }

          \hypersetup{
            draft=true,
            hidelinks,
            pdfborder={0 0 0}
          }
        }

        % Chapter & section titles (matching reference PDF elegance)
        \usepackage{titlesec}
        \titleformat{\chapter}{\Huge\bfseries}{}{0pt}{}
        \titleformat{\section}{\Large\bfseries}{}{0pt}{}
        \titleformat{\subsection}{\large\bfseries}{}{0pt}{}
        \titlespacing*{\section}{0pt}{1.5\baselineskip}{0.5\baselineskip}
        
        % Allow hyphenation/breaks in consecutive bold macros (fixes recipe headers)
        \makeatletter
        \def\bfstring#1{{\bfseries\interwordpenalty=500 #1}}
        \makeatother

        % Table styling
        \usepackage{booktabs}
        \usepackage{array}
        \renewcommand{\arraystretch}{1.2}

        % Prevent orphans
        \clubpenalty=10000
        \widowpenalty=1000000
    fig-format: png
    fig-dpi: 300
    fig-width: 5.5
    fig-height: 3.5
    fig-pos: 'htbp'

  epub:
    toc: true
    toc-depth: 3
    number-sections: true
    css: epub.css
