    width: 210mm;

    margin: 0;
    padding: 0;

    overflow: hidden;

    display: block;
    width: 210mm;

  }
  .fallback {
    width: 210mm;
    height: 297mm;

  .fallback .sub { font-size: 12pt; color: #67e8f9; margin-bottom: 24pt; }

</head>
